# docker-stack.yml - Docker Swarm 三节点集群部署
version: "3.8"

services:
  web:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    deploy:
      replicas: 3
      restart_policy:
        condition: any
      placement:
        max_replicas_per_node: 1
    networks:
      - webnet

networks:
  webnet:
    driver: overlay
